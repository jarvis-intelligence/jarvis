[project]
# Distribution name is `codeintel-mcp`; the plain `codeintel` name on PyPI is
# taken by an unrelated, abandoned package (Komodo Edit CodeIntel, last
# released 2018). The import package, CLI, and MCP server are all still
# `codeintel` — only the PyPI distribution name differs.
name = "codeintel-mcp"
version = "0.2.0"
description = "Local-first code intelligence MCP server (SCIP navigation + Zoekt search)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "phuongddx", email = "95doanphuong@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "code-intelligence",
    "code-search",
    "scip",
    "zoekt",
    "claude-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
    # Runtime must stay >= the gencode version vendored in scip_pb2.py
    # (generated against libprotoc 35.1 — see that file's header). Gencode
    # calls ValidateProtobufRuntimeVersion and refuses an older runtime.
    "protobuf>=7.35.1,<8.0.0",
    "zstandard>=0.23.0,<1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
semantic = [
    "lancedb>=0.20",
    "sentence-transformers>=3.0",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.urls]
Homepage = "https://github.com/phuongddx/codeintel"
Repository = "https://github.com/phuongddx/codeintel"
Issues = "https://github.com/phuongddx/codeintel/issues"
Changelog = "https://github.com/phuongddx/codeintel/blob/main/CHANGELOG.md"

[project.scripts]
codeintel = "codeintel.index_cli:main"
codeintel-server = "codeintel.server:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is `codeintel-mcp`, which would otherwise make the backend
# look for `src/codeintel_mcp/`. The import package is and stays `codeintel`.
module-name = "codeintel"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises real external binaries (scip-python, scip, zoekt-index)"]
