# Publishes setup.sh into jarvis-intelligence/jarvis-index.
#
# Why this exists: this repo is private, so raw.githubusercontent.com 404s for
# anyone without access -- which is every real user. jarvis-index is public and
# serves the installer script from its main branch.
#
# setup.sh is the ONLY thing synced. The Claude Code plugin and the
# marketplace definition are NOT here anymore: jarvis-index is their source of
# truth (edited there directly, versioned independently of the PyPI package),
# so overwriting them from this repo would clobber real changes. The zoekt and
# scip binaries reach jarvis-index via build-zoekt.yml / build-scip.yml
# releases, not this sync.
#
# Deliberately NOT synced: src/ (already on PyPI), tests/, docs/, plans/,
# .github/, CHANGELOG.md, pyproject.toml, git history, branches.
#
# Release-triggered because setup.sh's pins (SCIP_COMMIT_PIN, ZOEKT_COMMIT_PIN)
# move alongside releases; a change landing on main without a release does not
# reach jarvis-index until the next release or a manual dispatch.
name: sync-public-distribution

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Clone jarvis-index
        env:
          # Fine-grained PAT, Contents:write on jarvis-intelligence/jarvis-index only. The
          # default GITHUB_TOKEN cannot write to another repo.
          GH_TOKEN: ${{ secrets.JARVIS_DIST_TOKEN }}
        run: |
          set -eu
          git clone "https://x-access-token:${GH_TOKEN}@github.com/jarvis-intelligence/jarvis-index.git" "${RUNNER_TEMP}/jarvis"

      - name: Copy setup.sh over jarvis-index's copy
        run: |
          set -eu
          dest="${RUNNER_TEMP}/jarvis"
          # --ignore-times is load-bearing: rsync's default quick-check skips
          # files whose size and mtime match, and both legs of that check lie
          # here -- the checkout and the clone materialize within the same
          # second on a fast runner. Copy unconditionally; the git-diff gate
          # below already makes no-op releases push nothing.
          rsync -a --ignore-times setup.sh "${dest}/setup.sh"
          ls -la "$dest"

      - name: Commit and push only if something changed
        env:
          GH_TOKEN: ${{ secrets.JARVIS_DIST_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          cd "${RUNNER_TEMP}/jarvis"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # An empty commit on a no-op release is noise, not a record.
          if git diff --cached --quiet; then
            echo "jarvis-index already up to date; nothing to push"
            exit 0
          fi
          git commit -m "chore: sync setup.sh from jarvis@${SOURCE_SHA}"
          git push
