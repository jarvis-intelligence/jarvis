# Publishes server.json to the official MCP Registry on a GitHub Release.
#
# Why a separate workflow from publish-pypi.yml: the registry only stores
# metadata pointing at an already-published package, so it must run after PyPI
# has the version. Keeping it separate also means it can be re-run on its own
# (workflow_dispatch) without attempting a duplicate PyPI upload, which would
# fail since a version can never be re-uploaded.
#
# Why workflow_run and not `release: published`: that is the same event
# publish-pypi.yml listens to, so both ran in parallel and this one reached its
# publish step first. The registry rejected v0.3.0 with "version '0.3.0' was not
# found (status: 404)" because PyPI did not have it yet. workflow_run fires only
# after publish-pypi.yml has actually succeeded.
#
# Even then, PyPI is eventually consistent -- a version can be uploaded and not
# yet visible -- so the publish step retries rather than failing on the first
# 404. Both were observed during the 0.2.1 and 0.3.0 releases.
#
# Why github-oidc rather than `mcp-publisher login github`: the interactive
# flow needs a human to paste a device code, which would make every release
# block on someone being at a keyboard. OIDC authenticates the workflow itself
# and unlocks the io.github.phuongddx/* namespace with no stored secret.
#
# The registry verifies ownership by finding `mcp-name: <name>` in the README
# published to PyPI, so that marker and server.json's `name` must agree --
# publish-pypi.yml guards the marker, and the version guard below covers the rest.
name: publish-mcp-registry

on:
  workflow_run:
    workflows: [publish-pypi]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # workflow_run fires on failure too, so gate on the upload having succeeded.
    # A manual dispatch has no upstream run to inspect and is always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      # Required for `mcp-publisher login github-oidc`.
      id-token: write
      contents: read

    env:
      MCP_PUBLISHER_VERSION: "1.8.0"

    steps:
      - uses: actions/checkout@v4
        with:
          # A workflow_run event checks out the default branch by default, not
          # the commit that was released. Pinning to the upstream run's head_sha
          # keeps server.json's version identical to what was uploaded to PyPI,
          # even if main has moved on since.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install mcp-publisher
        run: |
          set -eu
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher --help >/dev/null
          echo "mcp-publisher v${MCP_PUBLISHER_VERSION} ready"

      - name: Check server.json versions match the packaged version
        run: |
          set -eu
          # The registry rejects re-publishing an existing version, and there is
          # no way to amend one. Forgetting to bump either version field in
          # server.json is therefore the likeliest failure, and it is silent
          # until the publish call itself rejects it.
          python3 - <<'PY'
          import json, sys, tomllib

          packaged = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          server = json.load(open("server.json"))

          problems = []
          if server["version"] != packaged:
              problems.append(f'server.json version {server["version"]!r} != pyproject {packaged!r}')
          for pkg in server["packages"]:
              if pkg["version"] != packaged:
                  problems.append(
                      f'server.json packages[{pkg["identifier"]}].version '
                      f'{pkg["version"]!r} != pyproject {packaged!r}'
                  )
          if problems:
              sys.exit("Version mismatch:\n  " + "\n  ".join(problems))
          print(f"server.json and pyproject.toml agree on {packaged}")
          PY

      - name: Validate server.json
        run: |
          set -eu
          ./mcp-publisher validate

      - name: Authenticate via GitHub OIDC
        run: |
          set -eu
          ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: |
          set -eu
          # The registry checks that the PyPI version in server.json actually
          # resolves, and PyPI is eventually consistent: v0.3.0 was rejected
          # with a 404 for a version that had already uploaded successfully.
          # Retry rather than fail, so a propagation delay does not require a
          # human to come back and re-run this.
          attempts=6
          delay=20
          for attempt in $(seq 1 "$attempts"); do
            if ./mcp-publisher publish; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "publish failed (attempt ${attempt}/${attempts}); retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          echo "publish still failing after ${attempts} attempts" >&2
          exit 1
