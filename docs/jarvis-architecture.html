<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jarvis · High-level architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
      --accent:#eb6c36; --rule:rgba(45,49,66,.12);
      --sans:'Geist',system-ui,sans-serif; --serif:'Instrument Serif',serif; --mono:'Geist Mono',ui-monospace,monospace;
    }
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem}
    .frame{max-width:1180px;width:100%}
    .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
    h1{font-family:var(--serif);font-size:clamp(1.4rem,2.2vw+.7rem,1.9rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.25rem}
    svg{width:100%;min-width:980px;display:block}
    .name{font:600 12px var(--sans);fill:#2d3142;text-anchor:middle}
    .sub{font:400 9px var(--mono);fill:#4f5d75;text-anchor:middle}
    .alab{font:400 8px var(--mono);fill:#4f5d75;text-anchor:middle;letter-spacing:.06em}
    .tag{font:500 7px var(--mono);text-anchor:middle;letter-spacing:.08em}
    .zlabel{font:500 7px var(--mono);fill:rgba(45,49,66,.40);text-anchor:middle;letter-spacing:.14em}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · jarvis</p>
    <h1>jarvis — local-first code intelligence (SCIP navigation + Zoekt search)</h1>

    <svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jarvis-arch-title jarvis-arch-desc">
      <title id="jarvis-arch-title">jarvis high-level architecture</title>
      <desc id="jarvis-arch-desc">Three-zone architecture: a build-time CLI pipeline (detect language, SCIP indexer, scip expt-convert, atomic publish) writes immutable artifacts into a shared storage layer (~/.jarvis: SCIP index db, registry db, Zoekt shards, LanceDB); a query-time MCP server reads them read-only to serve nine code-intelligence tools.</desc>

      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.5"/>

      <!-- ===== ZONES (behind arrows & nodes) ===== -->
      <!-- INDEX -->
      <rect x="32" y="56" width="976" height="184" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="430" y="60" width="180" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="69" class="zlabel">INDEX PIPELINE · jarvis CLI</text>
      <!-- STORAGE -->
      <rect x="32" y="272" width="976" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="430" y="276" width="180" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="285" class="zlabel">STORAGE · ~/.jarvis/</text>
      <!-- RUNTIME -->
      <rect x="32" y="424" width="976" height="184" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="414" y="428" width="212" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="437" class="zlabel">QUERY RUNTIME · MCP server</text>

      <!-- ===== ARROWS (behind nodes) ===== -->
      <!-- Index band flow -->
      <line x1="192" y1="148" x2="232" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="148" x2="440" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="608" y1="148" x2="648" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Atomic publish → storage layer (accent, the load-bearing invariant) -->
      <path d="M756,180 V292" fill="none" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
      <text x="764" y="234" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">atomic publish</text>
      <text x="764" y="246" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">os.replace swap</text>

      <!-- Reads: storage → runtime -->
      <!-- index-<sha>.db → QueryService (bridges over the registry vertical at x=400) -->
      <path d="M172,360 V412 H392 a8,8 0 0,1 16,0 H432 Q440,412 440,420 V484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- registry.db → QueryService (straight) -->
      <line x1="400" y1="360" x2="400" y2="484" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- .zoekt → ZoektLifecycle -->
      <path d="M628,360 V412 H732 Q740,412 740,420 V484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- read labels -->
      <rect x="262" y="404" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="290" y="413" class="alab">navigation</text>
      <rect x="372" y="410" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="419" class="alab">graph</text>
      <rect x="652" y="404" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="413" class="alab">search</text>

      <!-- Runtime band flow -->
      <line x1="188" y1="516" x2="212" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="368" y1="516" x2="392" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- FastMCP → ZoektLifecycle (routed below) -->
      <path d="M290,548 V584 H808 Q816,584 816,576 V548" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="520" y="576" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="585" class="alab">searchCode</text>

      <!-- ===== INDEX NODES ===== -->
      <!-- Git Repo (input) -->
      <rect x="64" y="116" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="124" width="30" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="87" y="133" class="tag" fill="#7a8399">SRC</text>
      <text x="128" y="152" class="name">Git Repo</text>
      <text x="128" y="168" class="sub">git ls-files · detect lang</text>

      <!-- SCIP Indexer (backend) -->
      <rect x="232" y="116" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="124" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="256" y="133" class="tag" fill="#2d3142">SCIP</text>
      <text x="316" y="152" class="name">SCIP Indexer</text>
      <text x="316" y="168" class="sub">scip-{ts,py,java,swift}</text>

      <!-- scip expt-convert (backend) -->
      <rect x="440" y="116" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="124" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="466" y="133" class="tag" fill="#2d3142">CONV</text>
      <text x="524" y="152" class="name">scip expt-convert</text>
      <text x="524" y="168" class="sub">SCIP → SQLite</text>

      <!-- Atomic Publish (focal) -->
      <rect x="648" y="116" width="216" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="656" y="124" width="30" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="671" y="133" class="tag" fill="#eb6c36">PUB</text>
      <text x="756" y="152" class="name" fill="#2d3142">Atomic Publish</text>
      <text x="756" y="168" class="sub" fill="#4f5d75">pointer swap · all-or-nothing</text>

      <!-- ===== STORAGE NODES ===== -->
      <!-- index-<sha>.db -->
      <rect x="72" y="304" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="80" y="312" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="100" y="321" class="tag" fill="#4f5d75">SCIP DB</text>
      <text x="172" y="338" class="name">index-&lt;sha&gt;.db</text>
      <text x="172" y="352" class="sub">navigation · immutable ro</text>

      <!-- registry.db -->
      <rect x="300" y="304" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="308" y="312" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="322" y="321" class="tag" fill="#4f5d75">REG</text>
      <text x="400" y="338" class="name">registry.db</text>
      <text x="400" y="352" class="sub">repos · package graph</text>

      <!-- .zoekt shards -->
      <rect x="528" y="304" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="536" y="312" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="556" y="321" class="tag" fill="#4f5d75">ZOEKT</text>
      <text x="628" y="338" class="name">.zoekt shards</text>
      <text x="628" y="352" class="sub">lexical search</text>

      <!-- LanceDB (optional) -->
      <rect x="756" y="304" width="212" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="764" y="312" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="778" y="321" class="tag" fill="#7a8399">VEC</text>
      <text x="862" y="338" class="name" fill="#2d3142">LanceDB</text>
      <text x="862" y="352" class="sub" fill="#7a8399">semantic vectors · optional</text>

      <!-- ===== RUNTIME NODES ===== -->
      <!-- MCP Client (input) -->
      <rect x="64" y="484" width="124" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="492" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="86" y="501" class="tag" fill="#7a8399">I/O</text>
      <text x="126" y="520" class="name">MCP Client</text>
      <text x="126" y="536" class="sub">stdio · JSON-RPC</text>

      <!-- FastMCP Server (focal) -->
      <rect x="212" y="484" width="156" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="220" y="492" width="30" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="235" y="501" class="tag" fill="#eb6c36">MCP</text>
      <text x="290" y="520" class="name" fill="#2d3142">FastMCP Server</text>
      <text x="290" y="536" class="sub" fill="#4f5d75">9 tools</text>

      <!-- QueryService (backend) -->
      <rect x="392" y="484" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="400" y="492" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="415" y="501" class="tag" fill="#2d3142">NAV</text>
      <text x="542" y="520" class="name">QueryService</text>
      <text x="542" y="536" class="sub">goToDef · refs · hierarchy · blastRadius</text>

      <!-- ZoektLifecycle (backend) -->
      <rect x="716" y="484" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="724" y="492" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="741" y="501" class="tag" fill="#2d3142">SRCH</text>
      <text x="816" y="520" class="name">ZoektLifecycle</text>
      <text x="816" y="536" class="sub">lazy zoekt-webserver</text>

      <!-- ===== LEGEND ===== -->
      <line x1="40" y1="624" x2="1000" y2="624" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="640" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="652" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Focal / invariant</text>

      <rect x="176" y="652" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="196" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Backend service</text>

      <rect x="312" y="652" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="332" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Store / artifact</text>

      <rect x="440" y="652" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="460" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Input / boundary</text>

      <rect x="576" y="652" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="596" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Optional</text>

      <line x1="676" y1="658" x2="704" y2="658" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
      <text x="712" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Atomic publish</text>

      <line x1="828" y1="658" x2="856" y2="658" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="864" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Read / flow</text>
    </svg>
  </div>
</body>
</html>
